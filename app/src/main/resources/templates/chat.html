<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real-Time Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
    <style>
        #chat { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .msg { animation: pop .18s ease-out; }
        @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
    </style>
</head>
<body class="font-sans min-h-screen bg-slate-100 text-slate-800 flex items-center justify-center p-3 sm:p-6">

    <main class="w-full max-w-2xl h-[90vh] max-h-[760px] flex flex-col bg-white rounded-3xl shadow-xl shadow-slate-300/50 ring-1 ring-slate-200 overflow-hidden">

        <!-- Header -->
        <header class="shrink-0 flex items-center justify-between gap-3 px-5 py-4 bg-teal-700 text-white">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-2xl bg-white/15 grid place-items-center">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5m-9 6 3-3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v13Z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Real-Time Chat</h1>
                    <p class="text-xs text-teal-100">Everyone here sees messages instantly</p>
                </div>
            </div>
            <div id="status" class="flex items-center gap-2 rounded-full bg-white/10 px-3 py-1.5 text-xs font-medium">
                <span id="statusDot" class="h-2 w-2 rounded-full bg-amber-300"></span>
                <span id="statusText">Connecting…</span>
            </div>
        </header>

        <!-- Messages -->
        <div id="chat" class="flex-1 min-h-0 overflow-y-auto bg-slate-50 px-4 py-5 space-y-4" aria-live="polite">
            <div id="emptyState" class="h-full grid place-items-center text-center text-slate-400">
                <div>
                    <svg class="mx-auto h-12 w-12 mb-3 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.69 9-8.25s-4.03-8.25-9-8.25S3 7.44 3 12c0 1.77.62 3.4 1.66 4.75L3.75 20.25 8.3 19.2c1.1.34 2.4.55 3.7.55Z"/>
                    </svg>
                    <p class="font-semibold text-slate-500">No messages yet</p>
                    <p class="text-sm">Enter your name and send the first one.</p>
                </div>
            </div>
        </div>

        <!-- Composer -->
        <footer class="shrink-0 border-t border-slate-200 bg-white p-4 space-y-3">
            <div class="flex items-center gap-2">
                <label for="senderInput" class="text-sm font-semibold text-slate-500 shrink-0">Name</label>
                <input id="senderInput" type="text" maxlength="24" placeholder="Your name"
                       class="w-full sm:w-56 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm placeholder-slate-400 transition focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500"/>
            </div>
            <div class="flex items-center gap-2">
                <input id="messageInput" type="text" placeholder="Type a message…" autocomplete="off"
                       class="flex-1 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm placeholder-slate-400 transition focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/40 focus:border-teal-500"/>
                <button id="sendMessage" disabled
                        class="flex items-center gap-2 rounded-2xl bg-teal-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-teal-700 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:shadow-none disabled:active:scale-100">
                    Send
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.27 3.13a.75.75 0 0 1 1.04-.9l16.5 8.25a.75.75 0 0 1 0 1.34l-16.5 8.25a.75.75 0 0 1-1.04-.9L6 12Zm0 0h7.5"/>
                    </svg>
                </button>
            </div>
        </footer>
    </main>

    <script>
        var stompClient = null;

        function setConnected(connected) {
            document.getElementById('sendMessage').disabled = !connected;
            document.getElementById('statusText').textContent = connected ? 'Online' : 'Disconnected';
            document.getElementById('statusDot').className =
                'h-2 w-2 rounded-full ' + (connected ? 'bg-emerald-300' : 'bg-rose-300');
        }

        function connect() {
            var socket = new SockJS('/chat');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function (frame) {
                setConnected(true);
                stompClient.subscribe('/topic/messages', function (message) {
                    console.log('Received:', message.body);
                    try {
                        showMessage(JSON.parse(message.body));
                    } catch (e) {
                        console.error('Could not display message:', e);
                    }
                });
            }, function () {
                setConnected(false);
            });
        }

        // Stable color per sender name
        function colorFor(name) {
            var h = 0;
            for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
            return 'hsl(' + h + ', 55%, 45%)';
        }

        function showMessage(message) {
            var chat = document.getElementById('chat');
            var empty = document.getElementById('emptyState');
            if (empty) empty.remove();

            var sender = (message.sender || 'Anonymous').trim() || 'Anonymous';
            var mine = sender === document.getElementById('senderInput').value.trim();
            var time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            var row = document.createElement('div');
            row.className = 'msg flex items-end gap-2 ' + (mine ? 'flex-row-reverse' : '');

            var avatar = document.createElement('div');
            avatar.className = 'h-8 w-8 shrink-0 rounded-full grid place-items-center text-xs font-bold text-white';
            avatar.style.background = colorFor(sender);
            avatar.textContent = sender.charAt(0).toUpperCase();

            var col = document.createElement('div');
            col.className = 'max-w-[75%] flex flex-col ' + (mine ? 'items-end' : 'items-start');

            var meta = document.createElement('span');
            meta.className = 'mb-1 px-1 text-xs text-slate-400';
            meta.textContent = (mine ? 'You' : sender) + ' · ' + time;

            var bubble = document.createElement('div');
            bubble.className = 'break-words px-4 py-2.5 text-sm leading-relaxed shadow-sm ' +
                (mine
                    ? 'bg-teal-600 text-white rounded-2xl rounded-br-md'
                    : 'bg-white text-slate-700 ring-1 ring-slate-200 rounded-2xl rounded-bl-md');
            bubble.textContent = message.content;

            col.appendChild(meta);
            col.appendChild(bubble);
            row.appendChild(avatar);
            row.appendChild(col);
            chat.appendChild(row);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            var sender = document.getElementById('senderInput').value.trim() || 'Anonymous';
            var input = document.getElementById('messageInput');
            var content = input.value.trim();
            if (!content || !stompClient) return;
            stompClient.send("/app/sendMessage", {}, JSON.stringify({ sender: sender, content: content }));
            input.value = '';
            input.focus();
        }

        document.getElementById('sendMessage').onclick = sendMessage;
        document.getElementById('messageInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
        window.onload = connect;
    </script>
</body>
</html>
